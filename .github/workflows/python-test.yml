name: Run Python tests
on:
  push:
    branches:
      - main

  workflow_dispatch:  # run manually
jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.5
          cache: pip
      - name: Prepare environment
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing --cov-report=json:.coverage.json

      - name: Check if coverage is >= 90%
        run: |
          $json = Get-Content ".coverage.json" -Raw
          $matches = [regex]::Matches($json, '"percent_covered":\s*([0-9]+)')
          $coverage = [int]$matches[0].Groups[1].Value

          if ($coverage -lt 90) {
            Write-Host "Did not meet coverage threshold (got $coverage%, expected at least 90%)"
            exit 1
          }